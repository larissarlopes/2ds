
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Playlist</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Estilos personalizados -->
    <style>
        body {
            background-color: #121212;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;   
            min-height: 100vh;
            margin: 0;
        }

        .cabecalho {
            padding: 30px;
            text-align: center;
        }

        .logo {
            width: 180px;
            height: auto;
        }

        #container {
            max-width: 800px;
            margin: 0 auto;
            padding: 25px;
        }

        h2 {
            color: rgb(255, 255, 255);
            text-align: center;
            margin-bottom: 60px;
        }

        #listaMusicas {
            margin-top: 60px;
        }
    </style>
</head>

<body>

    <!-- Cabeçalho -->
    <header class="cabecalho">
        <img
            src="assets/Spotify-Disco-Ball-Logo.webp"
            alt="Logo do Spotify"
            class="logo"
        >
    </header>

    <!-- Conteúdo principal -->
    <main id="container" class="container mt-4">
        
        <h2>Músicas</h2>

        <!-- Lista preenchida pelo JavaScript -->
        <ul id="listaMusicas" class="list-group">
            <!-- As músicas serão adicionadas aqui -->
        </ul>

    </main>

    <!-- JavaScript da playlist -->
    <script src="musica.js"></script>

</body>

</html>
